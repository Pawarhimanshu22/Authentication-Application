server:
  port: 8080

# Database configuration for development environment
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/Auth_Backend_SpringBoot
    username: root
    password: Himanshu

    hikari:
      # Connection pool size
      minimum-idle: 5
      maximum-pool-size: 20

      # Connection timeout settings (in milliseconds)
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

      # Performance optimizations
      auto-commit: true
      connection-test-query: SELECT 1
      pool-name: HikariPool-MySQL

      # Additional properties
      leak-detection-threshold: 60000
      initialization-fail-timeout: 1

      # MySQL specific optimizations
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false

  # JPA and Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: true

  logging:
    level:
      org.SpringFramework: DEBUG



  security:
    jwt:
      secret: ${JWT_SECRET:saiofal;vkasfbehwqpofhjas...}
      issuer: ${JWT_ISSUER:api.substring.com}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
      refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
      cookie-secure: ${JWT_COOKIE_SECURE:true}
      cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
      cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}