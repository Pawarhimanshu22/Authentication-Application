server:
  port: 5000



security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME}
    cookie-secure: ${JWT_COOKIE_SECURE}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE}


#     JWT_SECRET=your-long-random-secret
#     JWT_ISSUER=api.myapp.com
#     JWT_ACCESS_TTL_SECONDS=3600
#     JWT_REFRESH_TTL_SECONDS=604800
#     JWT_REFRESH_COOKIE_NAME=refreshToken
#     JWT_COOKIE_SECURE=true
#     JWT_COOKIE_HTTP_ONLY=true
#     JWT_COOKIE_SAME_SITE=Lax
